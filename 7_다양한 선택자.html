<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>다양한 선택자</title>
    <style>
        /* 1. 태그 선택자 */
        h1{color: deepskyblue; text-align: center;}

        /* 2. 클래스 선택자 */
        /* 태그 상관없이 이름이 같다면 모두 적용된다 */

        .intro{font-weight: bold; color:deeppink}

        /* 3. 아이디 선택자 */
        /* 같은 아이디를 가진 애가 html에 존재해서는 안됌
           identity의 약자 */
        /* 해당 요소만 유일하게 선택해 스타일을 주고 싶을 때 사용 */

        #favorite-list{
            background-color: ivory;
            padding: 10px   ;
        }

        /* 4. 그룹 선택자 */
        /* 태그 여러 개 선택 시 사용 */
        p, li {font-size: 20px;} /*pc 기본 글꼴 사이즈는 16px */

        /* 5. 클래스 선택자 */
        /* li 하나만 골라서 스타일 주고 싶음 */
        .bluecolor {color: blue;}
        .highlight {font-style: italic;}

        /* 6. 의사 클래스 선택자 */
        /* 많이 쓰이는 선택자 */
        /* anchor 태그는 선택이 된다는 기능 존재 */
        /* 마우스를 갖다대었을 때 나타나는 효과 지정 */
        a:hover {color: yellowgreen; text-decoration:none}
        
        /* 7. 속성 선택자 */
        /* 속성: 태그 뒤에 하나 뛰고 오는 값 class,title,id등 */
        h1[title="제목"] {background-color: ivory;}

        /* 8. 자식 선택자 */
        /* 부모 선택 후 자식을 선택. 자식 모두 선택됨 
        부모 바로 밑이 자식*/
        ul#favorite-list > li {list-style-type: square;}

        /* 9. 자손 선택자(자식 포함) */
        /* 선택된 부모 아래에 속한 모든 자식 중 해당하는 것들 전부
        부모 밑의 밑이후가 다 자손*/
        ul#favorite-list p{
            color: violet;
            font-weight: bold;
        }

        /* 10. 형제 선택자 */
        /* p.intro의 형제인 p를 찾아 바꿈 */
        p.intro + p {
            background-color: aqua;
        }


    </style>
</head>

<body>
    <h1 title="제목">선택자</h1><!--마우스 갖다대면 제목이라는 글자가 뜸-->

    <p class="intro">이 문단은 첫번째 문단입니다.</p>
    <p>이 문단은 두번째 문단입니다.</p>

    <ul id="favorite-list">
        <li class="bluecolor">김사과</li>
        <li class="bluecolor highlight">반하나</li> <!--클래스를 두 개 줬음 스타일에서 둘 다 적용됨-->
        <li class="bluecolor">오렌지</li>
        <li class="bluecolor"><p>이메론</p></li>
        <p>출석부</p>
    </ul>

    <a href="https://www.naver.com">외부 링크</a>
    <a href="#top">내부 링크</a>
    <a href="./5_하이퍼링크.html" class="intro">하이퍼링크</a>
</body>

</html>
