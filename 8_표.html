<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>표</title>
    <style>
        table {
            width: 600px;
            border-collapse: collapse;
            /*테두리 합치기*/
        }

        thead {
            background-color: deepskyblue;
            color: white;
        }

        tbody td {
            padding: 12px;
            /*안쪽 여백이 늘어남*/
            border-bottom: 1px solid #ddd;
            /*solid 직선*/
        }

        tbody tr:hover {
            background-color: pink;
        }
    </style>
</head>

<body>
    <table border="1" width="50%"><!--table 태그만 써서는 border안생김-->
        <!--CSS 생기며 border,width 사용 지양-->
        <!--width=500 , 50%   px은 고정 크기, %는 창 크기 따라 유동적-->

        <tr><!--행을 만드는 태그-->
            <td colspan="2">1</td><!--하나의 셀. 컨텐츠 크기만큼만 늘어남 칸 넓히는 건 CSS에서-->
            <!-- colspan="*" *개수만큼 합쳐졌다는 의미 1행의 2열을 하나로 합침 -->
        </tr>
        <!-- 표는 행 열의 전체 개수가 동일해야함  -->
        <tr>
            <td>3</td>
            <td>4</td>
        </tr>
        <tr>
            <td rowspan="2">5</td>
            <!-- 행을 합칠 때 쓰는 속성 3행과 4행을 합쳤다 -->
            <td>6</td>
        </tr>
        <tr>
            <td>8</td>
        </tr>
    </table>
    <hr><!--수평선-->

    <table>
        <thead><!--기능은 없지만 스타일에서 선택이 쉬워짐-->
            <tr>
                <th>이름</th> <!--컬럼 제목을 나타내는 태그 bold, text align center-->
                <th>과목</th>
                <th>점수</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td rowspan="2">김사과</td>
                <td>HTML</td>
                <td>95</td>
            </tr>
            <tr>
                <td>CSS</td>
                <td>95</td>
            </tr>
            <tr>
                <td>반하나</td>
                <td>JavaScript</td>
                <td>88</td>
            </tr>
        </tbody>
    </table>

</body>

</html>
