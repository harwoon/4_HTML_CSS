    <title>Document</title>
    <style>
        table {

            border: 1px solid #000;
        }

        tr,
        td {
            border: 1px solid #000;
            width: 100px;
            text-align: center;
        }

        <tr>
            <td rowspan="2">1</td>

        </tr>


        <tr>

        </tr>
        <tr>
            <td>5</td>
            <td>6</td>
        </tr>

    </table>
</body>

</html>
