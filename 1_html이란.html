<!DOCTYPE html> <!--html 버전마다 다름. 5버전인 것을 알 수 있음-->
<!--파이썬은 인터프리터가 오류 검사를 하지만, html은 오류가 나지않음. 브라우저가 자체 해석을 통해 출력
버전 표시를 해야 브라우저가 해당 버전에 맞게 해석을 함-->

<html lang="en"> <!--html 태그의 시작 열린 태그-->
<!--언어 설정. 우리와는 관계 없음. 시각 장애인에 대한 지원, 접근성, 소리에 대한 언어 선택 en, ko-->
<!--태그 속성(태그에 대한 부가 정보)-->

<head><!--헤드에는 문서 정보가 들어감 눈에 보이지 않음-->
    <meta charset="UTF-8"> <!--문서의 메타 정보 세팅-->
    <!--눈에 보이는 문자 인코딩 설정-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--모바일 환경에 잘 적응할 수 있게 반응형 설정
    브라우저가 자동으로 해상도를 낮춰 글씨 크기가 커짐-->
    <title>HTML</title> <!--제목표시줄(탭 상단)에 들어가는 이름.-->
</head>

<body><!--실제 화면을 구현하는 부분이 들어감 눈에 보이는 부분-->
    <!-- 
        HTML 주석문
        작성일: 2026-06-10
        작성자: 한혜원
    -->
    HTML 이란?!!!!!!
</body>
</html><!--닫힌 태그-->
