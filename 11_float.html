<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>float</title>
    <style>
        img{
            /* float:left; 이미지를 들어서 왼쪽으로 옮김, 글자말고 다른 태그도 있었다면 걔도 다 끌어올려짐 조절하는데 사용하는게 clear */
            margin-right: 20px;
        }
    </style>
</head>

<body>
    <!-- 
        div는 수직 정렬만 됨
        수직 배치는 문제가 없는데 수평 배치에 문제가 생김
        편법으로 수평 배치에 쓴 게 float 좋은 방법은 아님 명확하지 않음
    -->

    <!-- 
        float
        float는 CSS에서 요소를 문서의 일반적인 흐름에서 살짝 분리해 왼쪽이나 오른쪽으로 띄우는 속성으로, 주로 이미지 옆에 텍스트를 배치하거나 과거에는 다단 레이아웃을 구성하는 데 사용되었음
        뒤에 오는 애들을 끌어올려달라는 느낌
    -->

    <img src="spring1.png" alt="봄">Lorem ipsum dolor, sit amet consectetur adipisicing elit. Velit, autem harum,
    assumenda error inventore architecto voluptatibus ipsum culpa amet modi numquam quidem doloremque dolorem
    exercitationem odio eum, sapiente nemo cumque?
    <!-- html은 베이스라인에 붙어서 나오게 된다.글자가 이미지 옆에 베이스라인에 붙어 출력됨 -->

    <hr>

    <!-- 
        clear
        clear 속성은 float가 적용된 요소로 인해 흐트러진 레이아웃을 정리하기 위해 사용하는 CSS 속성으로, 앞에 떠 있는 (float된) 요소의 영향을 받아 나란히 배치되지 않도록 하고 그 아래로 내려가게 만드는 역할을 함
    -->

</body>

</html>
