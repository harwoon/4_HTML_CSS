<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3단 레이아웃</title>
    <style>
        *{
            box-sizing: border-box
        }
        .container{
            margin: 10px;
            padding: 10px;
            border: 1px solid #000;
        }

        header{
            border: 1px solid #000;
            padding: 10px;
            margin: 10px;
        }

        main{
            border: 1px solid #000;
            padding: 10px;
            margin: 10px;
        }

        .left{
            float: left;
            border: 1px solid #000;
            padding: 10px;
            width: 20%;
            height: 400px;
            margin: 5px;
        }

        .center{
            float: left;
            border: 1px solid #000;
            padding: 10px;      
            width: 55%;      
            height: 400px;
            margin: 5px;
        }

        .right{
            float:left;
            border: 1px solid #000;
            padding: 10px; 
            width: 20%; 
            height: 400px;    
            margin: 5px;      
        }

        .clear{
            clear: both;
        }

        footer{
            border: 1px solid #000;
            padding: 10px;
            margin: 10px;
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            헤더 영역
        </header>

        <main>
            <section class="left">
                왼쪽 컨텐츠 영역
            </section>

            <section class="center">
                가운데 컨텐츠 영역
            </section>

            <aside class="right">
                오른쪽 사이드 영역
            </aside>

            <div class="clear"></div>
        </main>

        <footer>
            푸터 영역
        </footer>
    </div>

</body>

</html>
