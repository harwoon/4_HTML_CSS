<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <title>CSS 우선순위 체크 예제</title>

  <style>
    p {
      /*1점*/
      color: blue;
    }

    .text {
      /*10점*/
      color: green;
    }

    #target {
      /*100점 제일 우선순위 높음*/
      color: red;
    }

    .text {
      /*스타일은 마지막에 오는거 덮어씀*/
      color: purple;
    }

    .force {
      /*important는 무조건 우선순위. css에서 무적. important 여러개면 마지막이 적용*/
      color: orange !important;
    }
  </style>
</head>

<body>

  <h2>CSS 우선순위 확인</h2>

  <p id="target" class="text">빨강(id우선) <!--아이디가 중복인데 이게 어떻게 되려나 그래도 아이디가 더 희귀하니 아이디로 갈까 빨강?-->
  </p>

  <p id="target" class="text force">주황(important 우선) <!--p나 id text 보다는 force가 들어가지 않을까 importatnt잇으니까 그래서 오렌지 -->

  </p>

  <p id="target" class="text force" style="color: black;">주황(important 우선) <!--이거는 force일까 인라인일까 음,,,force? 오렌지-->

  </p>

  <p id="target" class="text" style="color: black;">검정(인라인) <!--인라인 태그인 검정-->

  </p>

</body>

</html>
